name: Build British TV APK

on:
  push:
    branches: [main, master]
    paths:
      - "british-tv/**"
      - ".github/workflows/build-british-tv.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: british-tv
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: british-tv-apk
          path: british-tv/app/build/outputs/apk/debug/app-debug.apk
